[project]
name = "agentguard-contracts"
version = "0.1.0"
description = "AgentGuard on-chain policy contract."
requires-python = ">=3.11"
dependencies = [
  "algokit-utils>=3.0.0",
  "pyteal>=0.26.0",
  "py-algorand-sdk>=2.6.1",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
