[project]
name = "agentguard-ai-service"
version = "0.1.0"
description = "AgentGuard risk-scoring microservice (Claude Haiku)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "anthropic>=0.39",
  "cachetools>=5.5",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
