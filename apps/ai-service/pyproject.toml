[project]
name = "agentguard-ai-service"
version = "0.2.0"
description = "AgentGuard risk-scoring microservice (Groq / Llama-3.3)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "groq>=0.11",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
